name: scys-daily
on:
  schedule:
    - cron: "13 23 * * *"  # UTC 23:13 = 北京时间 07:13。实测 GitHub 定时延迟可达 90 分钟（整点/半点时段最堵），
                           # 提前到 07:13 + 错峰分钟数，即使延迟 100 分钟也能在 9 点前送达
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scys-daily

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate daily board
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 daily.py

      - name: Commit rotated state
        run: |
          git config user.name "scys-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +'%F') token rotated / history updated"
            git push
          fi
